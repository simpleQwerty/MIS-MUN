:root{--bg:#f6f7fb;--ink:#17203a;--mut:#5d6785;--acc:#1f5fbf;--line:#dde2ef;--ok:#17803d;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}

.go:disabled{opacity:.5;cursor:not-allowed}.link{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:0;margin-bottom:8px}
.note{font-size:13px;color:var(--mut)}.msg{margin-top:12px;font-size:14px}.bad{color:var(--bad)}.topics{font-size:13px;color:var(--mut);margin:6px 0 0;padding-left:18px}
</style></head><body>
<header><h1>MIS MUN 2027 — регистрация делегатов школы «Мирас»</h1><p>25–26 февраля 2027 · Алматы, пр. Аль-Фараби, 190</p></header>
<main id="app"></main>
<script>

const app=document.getElementById("app");let taken={},st={};
function el(t,a={},...k){const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(x==="class")e.className=y;else if(x.startsWith("on"))e.addEventListener(x.slice(2),y);else e.setAttribute(x,y)}e.append(...k);return e}
async function loadTaken(){if(!SCRIPT_URL)return;try{const r=await fetch(SCRIPT_URL);taken=(await r.json()).taken||{}}catch(e){}}
function list(){app.replaceChildren(el("div",{class:"card"},el("b",{},"Выберите комитет"),el("div",{class:"note"},"Каждая страна — один делегат. Занятые страны зачёркнуты.")));
COMMITTEES.forEach((c,i)=>app.append(el("button",{class:"com",onclick:()=>form(c)},el("b",{},(i+1)+". "+c.name+" — "+c.full),el("span",{},c.lang+" · "+c.countries.length+" стран"+(c.minGrade>9?" · только 10–12 классы":"")))))}
function form(c){st={c,country:null};app.replaceChildren();
const card=el("div",{class:"card"});
card.append(el("button",{class:"link",onclick:async()=>{await loadTaken();list()}},"← Все комитеты"),el("h2",{style:"margin:0;font-size:19px"},c.name+" — "+c.full),el("div",{class:"note"},"Язык: "+c.lang+(c.minGrade>9?" · участвуют только ученики 10–12 классов":"")),
el("ul",{class:"topics"},...c.topics.map(t=>el("li",{},t))),el("label",{},"Выберите страну"));
const chips=el("div",{class:"chips"});const tk=taken[c.name]||[];
c.countries.forEach(n=>{const t=tk.includes(n);const b=el("button",{type:"button",class:"chip"+(t?" taken":"")},n);
if(!t)b.addEventListener("click",()=>{st.country=n;[...chips.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");upd()});chips.append(b)});
const grade=el("select",{id:"gr"},el("option",{value:""},"—"));for(let g=c.minGrade;g<=12;g++)grade.append(el("option",{value:g},g));
card.append(chips,el("label",{},"Фамилия и имя"),el("input",{id:"fn",autocomplete:"name",maxlength:"80"}),
el("div",{class:"row"},el("div",{},el("label",{},"Класс (параллель)"),grade),el("div",{},el("label",{},"Буква / IB (A, B, IB…)"),el("input",{id:"lt",maxlength:"4"}))),
el("label",{},"Школьный e-mail"),el("input",{id:"em",type:"email",maxlength:"80"}),el("label",{},"Телефон (необязательно)"),el("input",{id:"ph",type:"tel",maxlength:"20"}),el("input",{id:"hp",tabindex:"-1",autocomplete:"off","aria-hidden":"true",style:"position:absolute;left:-9999px;width:1px;height:1px;opacity:0"}));st.t0=Date.now();
const go=el("button",{class:"go",type:"button",disabled:""},"Зарегистрироваться"),msg=el("div",{class:"msg"});card.append(go,msg);app.append(card);
const v=id=>document.getElementById(id).value.trim();
function upd(){go.disabled=!(st.country&&v("fn").length>2&&v("gr")&&v("lt")&&/.+@.+\..+/.test(v("em")))}
["fn","gr","lt","em"].forEach(i=>document.getElementById(i).addEventListener("input",upd));
go.addEventListener("click",async()=>{const rec={committee:c.name,country:st.country,name:v("fn"),grade:v("gr"),letter:v("lt"),email:v("em"),phone:v("ph"),hp:v("hp"),ms:Date.now()-st.t0};
if(!SCRIPT_URL){msg.className="msg bad";msg.textContent="Сайт ещё не подключён к таблице (SCRIPT_URL пуст).";return}
go.disabled=true;msg.className="msg";msg.textContent="Отправка…";
try{const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)});const j=await r.json();

else{msg.className="msg bad";msg.textContent=j.error||"Ошибка";if(j.taken){taken=j.taken;form(c)}else go.disabled=false}}
catch(e){msg.className="msg bad";msg.textContent="Нет связи с сервером. Попробуйте ещё раз.";go.disabled=false}});}
loadTaken().then(list);
</script></body></html>
